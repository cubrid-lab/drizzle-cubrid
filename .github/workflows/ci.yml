name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  impact:
    name: Classify CI impact
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          docs_only() {
            local p seen=0
            while IFS= read -r -d '' p; do
              seen=1
              case "$p" in
                *.md|*.mdx|*.rst|docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.svg|docs/*.webp) ;;
                *) return 1 ;;
              esac
            done
            [[ "$seen" == 1 ]]
          }
          docs_only < <(printf 'README.md\0docs/guide.md\0')
          if docs_only < <(printf 'README.md\0src/main.source\0'); then exit 1; fi
          if docs_only < <(printf '.github/workflows/ci.yml\0'); then exit 1; fi
          if docs_only < /dev/null; then exit 1; fi
          selected=false
          if [[ "$EVENT_NAME" == pull_request ]] &&
             git rev-parse --verify HEAD^2 >/dev/null 2>&1 &&
             git -c core.quotePath=false diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths.bin"; then
            if docs_only < "$RUNNER_TEMP/changed-paths.bin"; then selected=true; fi
          else
            echo "Unable to classify PR diff, or main push: full validation"
          fi
          echo "docs_only=$selected" >> "$GITHUB_OUTPUT"
          echo "CI impact: docs_only=$selected" >> "$GITHUB_STEP_SUMMARY"

  docs-check:
    needs: impact
    if: ${{ always() && needs.impact.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: git diff --check HEAD^1 HEAD

  lint-and-test:
    needs: impact
    if: ${{ needs.impact.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first lane to fail cancels the others, so a failure
      # that is specific to one Node version hides the state of every other.
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # The developer runner requires a recent Node. Node 18 consumer support
      # is independently enforced against the built npm tarball below.
      - name: Test with coverage
        run: npx vitest run --coverage --reporter=verbose

  package-artifact:
    name: Build packed npm package
    needs: impact
    if: ${{ needs.impact.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack candidate and record exact installed peer versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packed
          npm pack --ignore-scripts --pack-destination packed
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = require('./package-lock.json');
          for (const name of ['drizzle-orm', 'cubrid-client']) {
            const version = lock.packages?.[`node_modules/${name}`]?.version;
            if (!version) throw new Error(`Cannot determine installed peer version: ${name}`);
            fs.writeFileSync(`packed/${name}.version`, `${version}\n`);
          }
          NODE
          test "$(find packed -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-for-node18
          path: packed/
          if-no-files-found: error
          retention-days: 3

  node18-consumer:
    name: Node 18 packed-package consumer
    needs: package-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-for-node18
          path: packed/
      - name: Install actual tarball and tested peer versions
        shell: bash
        run: |
          set -euo pipefail
          echo "Node runtime: $(node --version)"
          mkdir consumer
          cd consumer
          npm init -y >/dev/null
          shopt -s nullglob
          tarballs=(../packed/*.tgz)
          test "${#tarballs[@]}" -eq 1
          drizzle_version=$(cat ../packed/drizzle-orm.version)
          client_version=$(cat ../packed/cubrid-client.version)
          npm install --ignore-scripts --no-audit --no-fund "${tarballs[0]}" "drizzle-orm@${drizzle_version}" "cubrid-client@${client_version}"
      - name: Exercise CJS and ESM exports on Node 18
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const cjs = require('drizzle-cubrid');
            const esm = await import('drizzle-cubrid');
            for (const api of [cjs, esm]) {
              assert.equal(typeof api.drizzle, 'function');
              assert.equal(typeof api.cubridTable, 'function');
              assert.equal(typeof api.cubridSet, 'function');
              const table = api.cubridTable('node18_consumer_smoke', { tags: api.cubridSet('tags') });
              assert.ok(table.tags, 'runtime table/column construction must work');
            }
            console.log('Node 18 packed CJS and ESM consumer assertions passed');
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

  ci-gate:
    name: CI gate
    if: always()
    needs: [impact, docs-check, lint-and-test, package-artifact, node18-consumer]
    runs-on: ubuntu-latest
    env:
      IMPACT: ${{ needs.impact.result }}
      DOCS_ONLY: ${{ needs.impact.outputs.docs_only }}
      DOCS_CHECK: ${{ needs.docs-check.result }}
      TESTS: ${{ needs.lint-and-test.result }}
      PACKAGE: ${{ needs.package-artifact.result }}
      NODE18: ${{ needs.node18-consumer.result }}
    steps:
      - name: Fail closed on missing selected validation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMPACT" == success ]] || { echo '::error::CI change classification failed'; exit 1; }
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$DOCS_CHECK" == success ]] || { echo "::error::Docs checks: $DOCS_CHECK"; exit 1; }
            for result in "$TESTS" "$PACKAGE" "$NODE18"; do
              [[ "$result" == skipped ]] || { echo "::error::Unexpected runtime job on docs-only PR: $result"; exit 1; }
            done
          else
            for result in "$TESTS" "$PACKAGE" "$NODE18"; do
              [[ "$result" == success ]] || { echo "::error::Required runtime check: $result"; exit 1; }
            done
          fi

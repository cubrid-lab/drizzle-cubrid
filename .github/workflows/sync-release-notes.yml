name: Synchronize reviewed GitHub Release notes

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/**"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only reviewed notes on main may overwrite public Release descriptions.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate this repository's release descriptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for note in sorted(Path("docs/releases").glob("v*.md")):
              body = note.read_text()
              assert body.startswith(f"## {note.stem} ("), note
              assert body.rstrip().splitlines()[-1].startswith("**Full Changelog:**"), note
              assert "github.com/cubrid-labs/drizzle-cubrid" not in body, note
              assert re.search(r" by @[A-Za-z0-9-]+", body), note
              assert body.count("**Full Changelog:**") == 1, note
              for lines in zip(body.splitlines(), body.splitlines()[1:]):
                  if lines[0].startswith("- "):
                      assert not lines[1].startswith("  "), note
          print("Release note checks passed.")
          PY
      - name: Synchronize existing release descriptions without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/releases/v*.md; do
            tag=$(basename "$file" .md)
            if ! err=$(gh release view "$tag" --repo "$GH_REPO" 2>&1 >/dev/null); then
              if [[ "$err" == *"release not found"* ]]; then
                echo "::notice::No existing GitHub Release for $tag; no new release created."
                continue
              fi
              echo "::error::Could not read GitHub Release $tag: $err"
              exit 1
            fi
            gh release edit "$tag" --repo "$GH_REPO" --title "drizzle-cubrid $tag" --notes-file "$file"
            echo "Updated GitHub Release $tag"
          done
